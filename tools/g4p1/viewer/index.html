<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G4.P1 GLB review</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20232a; color: #f2f0eb; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #15171c; }
      h1 { font-size: 16px; margin: 0 14px 0 0; }
      input { max-width: 240px; }
      #status { color: #d7c0a4; white-space: pre-wrap; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>G4.P1 model review</h1>
        <label>Open GLB <input id="file" type="file" accept=".glb,model/gltf-binary" /></label>
        <span id="status">Select a reconstructed GLB. Drag to orbit; scroll to zoom.</span>
      </header>
      <div id="viewport"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
